# nginx (aaPanel): /www/server/panel/vhost/nginx/docs.trieuhymedia.net.conf
server {
    listen 80;
    server_name docs.trieuhymedia.net;

    # Cho Let's Encrypt xác thực tên miền
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/docs.trieuhymedia.net;
    }

    # Tệp upload tối đa 200MB (khớp giới hạn của app)
    client_max_body_size 210m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    access_log /www/wwwlogs/docs.trieuhymedia.net.log;
    error_log /www/wwwlogs/docs.trieuhymedia.net.error.log;
}
