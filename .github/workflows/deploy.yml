name: Deploy lên droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets DEPLOY_* được lưu trong environment tên "DEPLOY_HOST" trên GitHub
    environment: DEPLOY_HOST
    steps:
      - uses: actions/checkout@v4

      - name: Cấu hình SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # In dấu vân tay (không phải bí mật) để đối chiếu với key trên server
          # Key đúng: SHA256:6lOFSQLOYxSmnDGQRxyg7tq0kp5UKC3XiqvNq6qAktQ
          echo "Fingerprint của DEPLOY_SSH_KEY:"
          ssh-keygen -lf ~/.ssh/deploy_key || echo "DEPLOY_SSH_KEY sai định dạng (thiếu dòng BEGIN/END?)"

      # Khoá deploy chỉ được chạy remote-deploy.sh (forced command trên server)
      - name: Gửi mã nguồn và deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: git archive --format=tar HEAD | ssh -i ~/.ssh/deploy_key docsapp@"$DEPLOY_HOST"
